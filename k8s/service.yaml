apiVersion: v1
kind: Service
metadata:
  name: taskboard-backend
  namespace: taskboard
spec:
  selector:
    app: taskboard-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-frontend
  namespace: taskboard
spec:
  selector:
    app: taskboard-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
