name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================================
  # JOB 1 — Unit Tests & Frontend Build (runs on ALL events)
  # ============================================================
  test:
    name: Unit Tests & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - name: Run Pytest Suite (/api/tasks endpoints)
        run: pytest -v
        working-directory: backend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend Application
        run: |
          npm ci
          npm run build
        working-directory: frontend

  # ============================================================
  # JOB 2 — Docker Build, Trivy Scan & GHCR Push
  #          Runs ONLY on push/dispatch to main branch
  # ============================================================
  build-scan-push:
    name: Docker Build (linux/amd64), Trivy Scan & GHCR Push
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Normalized Lowercase Image Names
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER_LC}/taskboard-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER_LC}/taskboard-frontend" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Images (linux/amd64, Tagged with Git SHA)
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./backend
          docker build --platform linux/amd64 \
            -t ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./frontend

      # ----------------------------------------------------------
      # Trivy Security Gate: fails pipeline on HIGH/CRITICAL CVEs
      # ignore-unfixed filters OS bugs without vendor patches
      # ----------------------------------------------------------
      - name: Trivy Vulnerability Scan (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          scan-type: 'image'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

      - name: Trivy Vulnerability Scan (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          scan-type: 'image'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

      - name: Push Images to GHCR
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      # ----------------------------------------------------------
      # GitOps: update values-prod.yaml with new SHA tags
      # Uses pinned yq v4.44.3; verifies tags before committing
      # ----------------------------------------------------------
      - name: Install Pinned yq (v4.44.3)
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update and Validate GitOps Production Image Tags
        run: |
          # Update backend and frontend tags in values-prod.yaml
          yq -i ".backend.tag = \"${{ env.IMAGE_TAG }}\" | .frontend.tag = \"${{ env.IMAGE_TAG }}\"" \
            helm/taskboard/values-prod.yaml

          # Verify both tags were written correctly and match published SHA
          BACKEND_TAG=$(yq '.backend.tag' helm/taskboard/values-prod.yaml)
          FRONTEND_TAG=$(yq '.frontend.tag' helm/taskboard/values-prod.yaml)

          if [ "$BACKEND_TAG" != "${{ env.IMAGE_TAG }}" ] || [ "$FRONTEND_TAG" != "${{ env.IMAGE_TAG }}" ]; then
            echo "ERROR: Tag verification failed!"
            echo "  backend=$BACKEND_TAG"
            echo "  frontend=$FRONTEND_TAG"
            echo "  expected=${{ env.IMAGE_TAG }}"
            exit 1
          fi
          echo "Tag verification successful: backend=$BACKEND_TAG, frontend=$FRONTEND_TAG"

          # Commit and push to main with [skip ci] to avoid pipeline loop
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/taskboard/values-prod.yaml
          if git diff --staged --quiet; then
            echo "No tag changes detected in values-prod.yaml — skipping commit."
          else
            git commit -m "chore(gitops): update image tags to ${{ env.IMAGE_TAG }} [skip ci]"
            git push origin main
          fi
